<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #374151; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .stage-body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #1F2937; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #374151; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #374151; }
      .edge { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #6B7280; stroke-width: 2.1; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .edge-blue { stroke: #2563EB; stroke-width: 2.7; fill: none; marker-end: url(#arrowBlue); }
      .group-label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #374151; }
    </style>
  </defs>

  <rect width="1700" height="1050" fill="#FFFFFF"/>
  <text x="850" y="55" text-anchor="middle" class="title">Nested AI4D Toolchain Architecture</text>
  <text x="850" y="86" text-anchor="middle" class="subtitle">EDPR drives retrieval from EDES, EDAS, EDIKB, and KEL; deterministic tools emit review artifacts and human feedback evolves the graph</text>

  <rect x="65" y="130" width="1570" height="220" rx="24" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="65" y="385" width="1570" height="300" rx="24" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="65" y="720" width="1570" height="220" rx="24" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>

  <text x="100" y="160" class="group-label">Problem definition and grounding</text>
  <text x="100" y="415" class="group-label">Governed knowledge layers and deterministic tools</text>
  <text x="100" y="750" class="group-label">Review artifacts, human judgement, and graph evolution</text>

  <!-- top flow nodes -->
  <g filter="url(#shadow)">
    <rect x="95" y="190" width="215" height="105" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
    <text x="202.5" y="226" text-anchor="middle" class="stage-title">Human query</text>
    <text x="202.5" y="253" text-anchor="middle" class="stage-body">Natural-language</text>
    <text x="202.5" y="274" text-anchor="middle" class="stage-body">engineering request</text>

    <rect x="390" y="190" width="235" height="105" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.2"/>
    <text x="507.5" y="226" text-anchor="middle" class="stage-title">Confirmed EDPR</text>
    <text x="507.5" y="253" text-anchor="middle" class="stage-body">Action, product, function,</text>
    <text x="507.5" y="274" text-anchor="middle" class="stage-body">constraints, unknowns</text>

    <rect x="705" y="190" width="245" height="105" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
    <text x="827.5" y="226" text-anchor="middle" class="stage-title">Retrieval + grounding</text>
    <text x="827.5" y="253" text-anchor="middle" class="stage-body">Vector recall plus</text>
    <text x="827.5" y="274" text-anchor="middle" class="stage-body">symbolic identifiers</text>

    <rect x="1030" y="190" width="245" height="105" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
    <text x="1152.5" y="226" text-anchor="middle" class="stage-title">Deterministic gates</text>
    <text x="1152.5" y="253" text-anchor="middle" class="stage-body">Schema, topology, evidence,</text>
    <text x="1152.5" y="274" text-anchor="middle" class="stage-body">plot/report checks</text>

    <rect x="1360" y="190" width="220" height="105" rx="18" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.2"/>
    <text x="1470" y="226" text-anchor="middle" class="stage-title">Output decision</text>
    <text x="1470" y="253" text-anchor="middle" class="stage-body">Layout, plot/report,</text>
    <text x="1470" y="274" text-anchor="middle" class="stage-body">or explicit gap</text>
  </g>

  <!-- top horizontal arrows in gaps only -->
  <path class="edge" d="M310 242 L390 242"/>
  <path class="edge" d="M625 242 L705 242"/>
  <path class="edge" d="M950 242 L1030 242"/>
  <path class="edge" d="M1275 242 L1360 242"/>

  <!-- knowledge nodes -->
  <g filter="url(#shadow)">
    <rect x="120" y="470" width="210" height="115" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2.2"/>
    <text x="225" y="505" text-anchor="middle" class="stage-title">EDES</text>
    <text x="225" y="532" text-anchor="middle" class="stage-body">Component definitions</text>
    <text x="225" y="553" text-anchor="middle" class="stage-body">geometry, interfaces,</text>
    <text x="225" y="574" text-anchor="middle" class="stage-body">local constraints</text>

    <rect x="385" y="470" width="210" height="115" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2"/>
    <text x="490" y="505" text-anchor="middle" class="stage-title">EDAS</text>
    <text x="490" y="532" text-anchor="middle" class="stage-body">Assembly topology</text>
    <text x="490" y="553" text-anchor="middle" class="stage-body">anchors, contact,</text>
    <text x="490" y="574" text-anchor="middle" class="stage-body">associations</text>

    <rect x="650" y="470" width="230" height="115" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
    <text x="765" y="505" text-anchor="middle" class="stage-title">EDIKB</text>
    <text x="765" y="532" text-anchor="middle" class="stage-body">Evidence graph</text>
    <text x="765" y="553" text-anchor="middle" class="stage-body">strain, moment, rules,</text>
    <text x="765" y="574" text-anchor="middle" class="stage-body">limits, study gaps</text>

    <rect x="935" y="470" width="210" height="115" rx="18" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.2"/>
    <text x="1040" y="505" text-anchor="middle" class="stage-title">KEL</text>
    <text x="1040" y="532" text-anchor="middle" class="stage-body">Reviewed lessons</text>
    <text x="1040" y="553" text-anchor="middle" class="stage-body">root cause, changes,</text>
    <text x="1040" y="574" text-anchor="middle" class="stage-body">closeout state</text>

    <rect x="1250" y="470" width="260" height="115" rx="18" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
    <text x="1380" y="505" text-anchor="middle" class="stage-title">Deterministic tools</text>
    <text x="1380" y="532" text-anchor="middle" class="stage-body">Validators, solver,</text>
    <text x="1380" y="553" text-anchor="middle" class="stage-body">plotter, report builder,</text>
    <text x="1380" y="574" text-anchor="middle" class="stage-body">FEA/ML bridge records</text>
  </g>

  <!-- vector layer outline and label placed below nodes -->
  <rect x="95" y="445" width="1080" height="165" rx="28" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="635" y="640" text-anchor="middle" class="label" fill="#2563EB">Vectorised retrieval layer indexes selected EDES, EDAS, EDIKB, and KEL text fields for semantic recall; symbolic records remain authoritative</text>

  <!-- retrieval to knowledge: routed down to a bus, then up/down into nodes; avoids text -->
  <path class="edge-blue" d="M827 295 L827 365 L225 365 L225 470"/>
  <path class="edge-blue" d="M827 365 L490 365 L490 470"/>
  <path class="edge-blue" d="M827 365 L765 365 L765 470"/>
  <path class="edge-blue" d="M827 365 L1040 365 L1040 470"/>
  <text x="655" y="354" text-anchor="middle" class="label">retrieve and ground against governed knowledge</text>

  <!-- gates to tools: clean right-side route -->
  <path class="edge" d="M1152 295 L1152 380 L1380 380 L1380 470"/>
  <text x="1285" y="365" text-anchor="middle" class="label">execute checks</text>

  <!-- knowledge to tools: route from bottoms to lower bus then into tools, not through labels -->
  <path class="edge" d="M225 585 L225 665 L1380 665 L1380 585"/>
  <path class="edge" d="M490 585 L490 665"/>
  <path class="edge" d="M765 585 L765 665"/>
  <path class="edge" d="M1040 585 L1040 665"/>
  <text x="803" y="686" text-anchor="middle" class="label">structured records feed validators, layout emission, deterministic plotter, and reports</text>

  <!-- lower nodes -->
  <g filter="url(#shadow)">
    <rect x="230" y="790" width="265" height="105" rx="18" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2.2"/>
    <text x="362.5" y="824" text-anchor="middle" class="stage-title">Review artifacts</text>
    <text x="362.5" y="852" text-anchor="middle" class="stage-body">Layout JSON, plot,</text>
    <text x="362.5" y="873" text-anchor="middle" class="stage-body">CSV parameters, report</text>

    <rect x="705" y="790" width="265" height="105" rx="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.2"/>
    <text x="837.5" y="824" text-anchor="middle" class="stage-title">Human review</text>
    <text x="837.5" y="852" text-anchor="middle" class="stage-body">Accept, reject, correct,</text>
    <text x="837.5" y="873" text-anchor="middle" class="stage-body">or request more evidence</text>

    <rect x="1180" y="790" width="275" height="105" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.2"/>
    <text x="1317.5" y="824" text-anchor="middle" class="stage-title">Graph evolution</text>
    <text x="1317.5" y="852" text-anchor="middle" class="stage-body">KEL promotes reviewed</text>
    <text x="1317.5" y="873" text-anchor="middle" class="stage-body">updates into knowledge</text>
  </g>

  <!-- tools to review artifacts: route around boxes -->
  <path class="edge" d="M1380 585 L1380 710 L362 710 L362 790"/>
  <text x="870" y="733" text-anchor="middle" class="label">emit review package</text>

  <!-- output decision to artifacts: far right edge then bottom, avoids boxes -->
  <path class="edge" d="M1470 295 L1585 295 L1585 710 L495 710 L495 820"/>
  <text x="1596" y="525" text-anchor="middle" class="label" transform="rotate(90 1596 525)">layout or explicit gap</text>

  <!-- review and feedback arrows in gaps -->
  <path class="edge" d="M495 842 L705 842"/>
  <text x="600" y="827" text-anchor="middle" class="label">review</text>
  <path class="edge" d="M970 842 L1180 842"/>
  <text x="1075" y="827" text-anchor="middle" class="label">feedback</text>

  <!-- graph evolution back to KEL: route outside, no text crossing -->
  <path class="edge-soft" d="M1318 790 L1318 735 L1540 735 L1540 430 L1040 430 L1040 470"/>
  <text x="1456" y="720" text-anchor="middle" class="label">approved update</text>

  <rect x="90" y="958" width="1520" height="58" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="118" y="993" class="caption"><tspan font-weight="700">Key principle:</tspan> the LLM helps interpret and explain; authoritative engineering meaning remains in EDES, EDAS, EDIKB, KEL, and deterministic gate outputs.</text>
</svg>
