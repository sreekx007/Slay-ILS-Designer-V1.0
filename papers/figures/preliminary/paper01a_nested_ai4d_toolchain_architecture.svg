<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #374151; }
      .stage-title { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .stage-body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #1F2937; }
      .small-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .small-body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #1F2937; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #374151; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #374151; }
      .edge { stroke: #374151; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #6B7280; stroke-width: 2.1; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .edge-blue { stroke: #2563EB; stroke-width: 2.8; fill: none; marker-end: url(#arrowBlue); }
      .group-label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #374151; }
    </style>
  </defs>

  <rect width="1700" height="1050" fill="#FFFFFF"/>
  <text x="850" y="55" text-anchor="middle" class="title">Nested AI4D Toolchain Architecture</text>
  <text x="850" y="86" text-anchor="middle" class="subtitle">EDPR drives retrieval from EDES, EDAS, EDIKB, and KEL; deterministic tools emit review artifacts and human feedback evolves the graph</text>

  <!-- swimlane background -->
  <rect x="65" y="130" width="1570" height="220" rx="24" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="65" y="385" width="1570" height="300" rx="24" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="65" y="720" width="1570" height="220" rx="24" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="2"/>

  <text x="100" y="160" class="group-label">Problem definition and grounding</text>
  <text x="100" y="415" class="group-label">Governed knowledge layers and deterministic tools</text>
  <text x="100" y="750" class="group-label">Review artifacts, human judgement, and graph evolution</text>

  <!-- main upper flow -->
  <g filter="url(#shadow)">
    <rect x="95" y="190" width="215" height="105" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/>
    <text x="202.5" y="226" text-anchor="middle" class="stage-title">Human query</text>
    <text x="202.5" y="253" text-anchor="middle" class="stage-body">Natural-language</text>
    <text x="202.5" y="274" text-anchor="middle" class="stage-body">engineering request</text>

    <rect x="390" y="190" width="235" height="105" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.2"/>
    <text x="507.5" y="226" text-anchor="middle" class="stage-title">Confirmed EDPR</text>
    <text x="507.5" y="253" text-anchor="middle" class="stage-body">Action, product, function,</text>
    <text x="507.5" y="274" text-anchor="middle" class="stage-body">constraints, unknowns</text>

    <rect x="705" y="190" width="245" height="105" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
    <text x="827.5" y="226" text-anchor="middle" class="stage-title">Retrieval + grounding</text>
    <text x="827.5" y="253" text-anchor="middle" class="stage-body">Vector recall plus</text>
    <text x="827.5" y="274" text-anchor="middle" class="stage-body">symbolic identifiers</text>

    <rect x="1030" y="190" width="245" height="105" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/>
    <text x="1152.5" y="226" text-anchor="middle" class="stage-title">Deterministic gates</text>
    <text x="1152.5" y="253" text-anchor="middle" class="stage-body">Schema, topology, evidence,</text>
    <text x="1152.5" y="274" text-anchor="middle" class="stage-body">plot/report checks</text>

    <rect x="1360" y="190" width="220" height="105" rx="18" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.2"/>
    <text x="1470" y="226" text-anchor="middle" class="stage-title">Output decision</text>
    <text x="1470" y="253" text-anchor="middle" class="stage-body">Layout, plot/report,</text>
    <text x="1470" y="274" text-anchor="middle" class="stage-body">or explicit gap</text>
  </g>

  <path class="edge" d="M310 242 C340 242 360 242 390 242"/>
  <path class="edge" d="M625 242 C655 242 675 242 705 242"/>
  <path class="edge" d="M950 242 C980 242 1000 242 1030 242"/>
  <path class="edge" d="M1275 242 C1305 242 1330 242 1360 242"/>

  <!-- knowledge layer nodes -->
  <g filter="url(#shadow)">
    <rect x="135" y="465" width="210" height="120" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2.2"/>
    <text x="240" y="500" text-anchor="middle" class="stage-title">EDES</text>
    <text x="240" y="527" text-anchor="middle" class="stage-body">Component definitions</text>
    <text x="240" y="548" text-anchor="middle" class="stage-body">geometry, interfaces,</text>
    <text x="240" y="569" text-anchor="middle" class="stage-body">local constraints</text>

    <rect x="400" y="465" width="210" height="120" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2"/>
    <text x="505" y="500" text-anchor="middle" class="stage-title">EDAS</text>
    <text x="505" y="527" text-anchor="middle" class="stage-body">Assembly topology</text>
    <text x="505" y="548" text-anchor="middle" class="stage-body">anchors, contact,</text>
    <text x="505" y="569" text-anchor="middle" class="stage-body">associations</text>

    <rect x="665" y="465" width="230" height="120" rx="18" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
    <text x="780" y="500" text-anchor="middle" class="stage-title">EDIKB</text>
    <text x="780" y="527" text-anchor="middle" class="stage-body">Evidence graph</text>
    <text x="780" y="548" text-anchor="middle" class="stage-body">strain, moment, rules,</text>
    <text x="780" y="569" text-anchor="middle" class="stage-body">limits, study gaps</text>

    <rect x="950" y="465" width="210" height="120" rx="18" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2.2"/>
    <text x="1055" y="500" text-anchor="middle" class="stage-title">KEL</text>
    <text x="1055" y="527" text-anchor="middle" class="stage-body">Reviewed lessons</text>
    <text x="1055" y="548" text-anchor="middle" class="stage-body">root cause, changes,</text>
    <text x="1055" y="569" text-anchor="middle" class="stage-body">closeout state</text>

    <rect x="1220" y="465" width="260" height="120" rx="18" fill="#CCFBF1" stroke="#0D9488" stroke-width="2.2"/>
    <text x="1350" y="500" text-anchor="middle" class="stage-title">Deterministic tools</text>
    <text x="1350" y="527" text-anchor="middle" class="stage-body">Validators, solver,</text>
    <text x="1350" y="548" text-anchor="middle" class="stage-body">plotter, report builder,</text>
    <text x="1350" y="569" text-anchor="middle" class="stage-body">FEA/ML bridge records</text>
  </g>

  <!-- vector layer around EDES/EDAS/EDIKB/KEL -->
  <rect x="110" y="435" width="1080" height="180" rx="28" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="650" y="635" text-anchor="middle" class="label" fill="#2563EB">Vectorised retrieval layer indexes selected EDES, EDAS, EDIKB, and KEL text fields for semantic recall; symbolic records remain authoritative</text>

  <!-- retrieval to knowledge layers -->
  <path class="edge-blue" d="M827 295 C820 350 780 400 780 465"/>
  <text x="840" y="382" class="label">retrieve evidence</text>
  <path class="edge-blue" d="M795 295 C650 355 500 395 505 465"/>
  <text x="585" y="380" class="label">ground assembly</text>
  <path class="edge-blue" d="M760 295 C560 335 245 385 240 465"/>
  <text x="385" y="372" class="label">ground components</text>
  <path class="edge-blue" d="M865 295 C945 355 1050 390 1055 465"/>
  <text x="980" y="378" class="label">retrieve lessons</text>

  <!-- knowledge to tools -->
  <path class="edge" d="M345 525 C700 645 1030 645 1220 545"/>
  <path class="edge" d="M610 525 C820 625 1050 625 1220 545"/>
  <path class="edge" d="M895 525 C1030 600 1130 595 1220 545"/>
  <path class="edge" d="M1160 525 C1185 525 1198 525 1220 525"/>
  <text x="930" y="653" text-anchor="middle" class="label">structured records feed validators, layout emission, deterministic plotter, and reports</text>

  <!-- gates to tools -->
  <path class="edge" d="M1152 295 C1160 365 1220 420 1285 465"/>
  <text x="1228" y="365" class="label">execute checks</text>

  <!-- bottom artifacts -->
  <g filter="url(#shadow)">
    <rect x="235" y="790" width="260" height="105" rx="18" fill="#FEF9C3" stroke="#CA8A04" stroke-width="2.2"/>
    <text x="365" y="824" text-anchor="middle" class="stage-title">Review artifacts</text>
    <text x="365" y="852" text-anchor="middle" class="stage-body">Layout JSON, plot,</text>
    <text x="365" y="873" text-anchor="middle" class="stage-body">CSV parameters, report</text>

    <rect x="700" y="790" width="260" height="105" rx="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.2"/>
    <text x="830" y="824" text-anchor="middle" class="stage-title">Human review</text>
    <text x="830" y="852" text-anchor="middle" class="stage-body">Accept, reject, correct,</text>
    <text x="830" y="873" text-anchor="middle" class="stage-body">or request more evidence</text>

    <rect x="1165" y="790" width="270" height="105" rx="18" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.2"/>
    <text x="1300" y="824" text-anchor="middle" class="stage-title">Graph evolution</text>
    <text x="1300" y="852" text-anchor="middle" class="stage-body">KEL promotes reviewed</text>
    <text x="1300" y="873" text-anchor="middle" class="stage-body">updates into knowledge</text>
  </g>

  <path class="edge" d="M1350 585 C1235 720 665 720 495 810"/>
  <text x="870" y="730" text-anchor="middle" class="label">emit review package</text>
  <path class="edge" d="M495 842 C570 842 625 842 700 842"/>
  <text x="598" y="827" text-anchor="middle" class="label">review</text>
  <path class="edge" d="M960 842 C1030 842 1095 842 1165 842"/>
  <text x="1062" y="827" text-anchor="middle" class="label">feedback</text>
  <path class="edge-soft" d="M1300 790 C1330 705 1280 625 1160 555"/>
  <text x="1390" y="690" text-anchor="middle" class="label">approved update</text>

  <!-- output decision to artifacts -->
  <path class="edge" d="M1470 295 C1515 520 1530 720 1435 805"/>
  <text x="1530" y="555" text-anchor="middle" class="label">layout or gap</text>

  <!-- notes -->
  <rect x="90" y="958" width="1520" height="58" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="118" y="993" class="caption"><tspan font-weight="700">Key principle:</tspan> the LLM helps interpret and explain; authoritative engineering meaning remains in EDES, EDAS, EDIKB, KEL, and deterministic gate outputs.</text>
</svg>
